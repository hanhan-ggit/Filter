name: Sync from upstream ddgksf2013/Filter

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: ddgksf2013/Filter
          upstream_sync_branch: master
          test_mode: false
